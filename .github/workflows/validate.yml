name: Validate workflow package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run setup
      - run: python scripts/validate-public.py
      - run: python -m unittest discover -s skills/narration-video-director/scripts -p 'test_*.py'
      - run: python skills/narration-video-director/scripts/creative_review.py check --project examples/collage-paper-study --record creative-review.json
